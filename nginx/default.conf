server_names_hash_bucket_size 64;
proxy_headers_hash_bucket_size 512;
server_names_hash_max_size 512;
large_client_header_buffers 8 64k;
proxy_read_timeout 3600;
proxy_connect_timeout 3600;

# include configs for spamers, bad bots to reject
include /customization/blacklist.conf;

# Rate limit configurations
limit_req_zone $binary_remote_addr zone=all:10m rate=20r/s;


upstream django {
  server arches:8000;
}

server {
    listen 80;
    server_name 192.168.48.12 localhost;

    charset utf-8;
    client_max_body_size 100M;

    access_log /logs/nginx/access.log;
    error_log /logs/nginx/error.log;
    if ($bad_bot) {
        return 444;
    }

    location /static/ {
        alias /static_root/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        add_header X-Static-Path "/static_root/" always;
    
        location ~* \.(css|js)$ {
            alias /static_root/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            alias /static_root/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        try_files $uri @django_static;
    }
    
    location @django_static {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/ld+json
               application/geo+json text/xml application/xml application/xml+rss
               text/javascript application/javascript text/html;
}